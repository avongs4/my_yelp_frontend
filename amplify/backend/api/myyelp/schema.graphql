type Business @model @auth(rules: [{ allow: owner }, { allow: private }]) {
  id: ID!
  name: String!
  category: String
  location: String
  reviews: [Review] @hasMany(indexName: "byBusiness", fields: ["id"])
}

type Review @model @auth(rules: [{ allow: owner }, { allow: private }]) {
  id: ID!
  content: String!
  rating: Int!
  businessID: ID! @index(name: "byBusiness")
  createdAt: AWSDateTime
}
